---
driver:
  name: exec
transport:
  name: exec
provisioner:
  name: chef_infra
  product_name: cinc
  product_version: latest
  chef_license: accept-no-persist
  multiple_converge: 2
  enforce_idempotency: true
  deprecations_as_errors: true
verifier:
  name: inspec
platforms:
  - name: windows-2025
suites:
  - name: tools64
    provisioner:
      named_run_list: remove
    verifier:
      inspec_tests:
        - test/integration/remove
  - name: msys2
    provisioner:
      named_run_list: msys2_remove
    verifier:
      inspec_tests:
        - test/integration/msys2_remove
