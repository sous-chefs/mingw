---
driver:
  name: exec
transport:
  name: exec
provisioner:
  name: chef_infra
  product_name: cinc
  product_version: latest
  chef_license: accept-no-persist
  multiple_converge: 2
  enforce_idempotency: true
  deprecations_as_errors: true
verifier:
  name: inspec
platforms:
  - name: windows-2025
suites:
  - name: default
    provisioner:
      named_run_list: default
    verifier:
      inspec_tests:
        - test/integration/default
  - name: tools32
    provisioner:
      named_run_list: tools32
    verifier:
      inspec_tests:
        - test/integration/tools32
  - name: tools64
    provisioner:
      named_run_list: tools64
    verifier:
      inspec_tests:
        - test/integration/tools64
  - name: msys2
    provisioner:
      named_run_list: msys2
    verifier:
      inspec_tests:
        - test/integration/msys2
